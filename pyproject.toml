[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-grader"
version = "0.1.0"
description = "Collaborative pass/fail/retry grading for LST × frequency datasets by day"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bokeh>=3.0",
    "panel>=1.3",
    "pandas>=2.0",
    "param>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_grader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
